<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e15" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>my.modbot.co</title>

    <!-- The three routes are three built files rather than one, so the preview a chat app draws is
         the one for the page the link actually opens. A crawler runs no script, so tags the app set
         after it loaded would never be read. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="my.modbot.co" />
    <meta property="og:url" content="https://my.modbot.co/" />
    <meta property="og:title" content="my.modbot.co" />
    <meta property="og:description" content="Your group's Modbot, and the ones you have opened before." />
    <meta property="og:image" content="https://modbot.co/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Modbot: self-hosted moderation for VRChat groups." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="my.modbot.co" />
    <meta name="twitter:description" content="Your group's Modbot, and the ones you have opened before." />
    <meta name="twitter:image" content="https://modbot.co/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
