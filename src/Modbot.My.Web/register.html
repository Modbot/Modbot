    <title>Set up Modbot · my.modbot.co</title>

    <!-- The page a Modbot sends a moderator to, so this is the link that gets pasted into a group's
         Discord. The preview says what the link is for, and never what the link claimed about the
         group: anybody can write a register link, and the words here are the same for every one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="my.modbot.co" />
    <meta property="og:url" content="https://my.modbot.co/register" />
    <meta property="og:title" content="Set up Modbot · my.modbot.co" />
    <meta property="og:description" content="Remember a group's Modbot, so you can open it from here." />
    <meta property="og:image" content="https://modbot.co/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Modbot: self-hosted moderation for VRChat groups." />
