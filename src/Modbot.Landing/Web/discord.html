<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Only ever shown when the server has no Discord address, so it is not a page to index. -->
    <meta name="robots" content="noindex" />
    <title>Discord · Modbot</title>
    <meta name="description" content="Where Modbot's Discord server would be." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e15" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>try{var t=localStorage.getItem('modbot-theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}</script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entries/static.ts"></script>
  </body>
</html>
