<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f7f6fb;color:#111113;font-family:"IBM Plex Sans",system-ui,sans-serif;position:relative}

.m{display:grid;place-items:center}
.m img{width:340px;filter:drop-shadow(0 18px 30px rgb(40 30 90 / 0.18))}
.foot{position:absolute;left:80px;bottom:56px;font-size:20px;color:#5c6475}

  <div>
    <div class="brand"><img src="{{asset:vector-mark.svg}}" alt="">Modbot</div>

  </div>
  <div class="m"><img src="{{asset:mascot-refined-flat-512.png}}" alt=""></div>
