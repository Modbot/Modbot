          - heading "Every ban gets a case file." [level=2] [ref=e554]
          - paragraph [ref=e555]: Pick the reasons, write it up, attach screenshots and clips. Modbot keeps a copy of the person’s profile as it was at that moment.
          - list [ref=e556]:
            - listitem [ref=e557]: PNG, JPEG, WebP, GIF, MP4 and WebM, checked by their contents, so a renamed file does not pass.
            - listitem [ref=e558]: Stored in an S3-compatible bucket, a mounted folder or PostgreSQL. Every file is fingerprinted.
            - listitem [ref=e559]: Every edit is kept. A case file can be withdrawn with a note, and it stays on record.
            - listitem [ref=e560]: The Bans page counts recent bans that still have no case file.
