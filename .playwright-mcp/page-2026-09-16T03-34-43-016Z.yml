        - generic [ref=e1019]:
          - heading "Modbot and VRChat’s rules." [level=2] [ref=e1020]
          - paragraph [ref=e1021]: What Modbot does with the VRChat account it is given, and with your Discord server.
        - generic [ref=e1022]:
          - generic [ref=e1023]:
            - term [ref=e1024]: The VRChat client
            - definition [ref=e1025]: Modbot does not modify the game. The server reads VRChat’s API the way the VRChat website does, and the desktop client reads the log file VRChat writes on your PC.
          - generic [ref=e1026]:
            - term [ref=e1027]: The VRChat account
            - definition [ref=e1028]: Modbot signs in as one account you give it, and that account must be a moderator of the group. VRChat has no limited-access login for tools, so the account’s password and two-factor secret are stored encrypted in your database.
            - definition [ref=e1029]: It uses that one account, with one optional proxy for hosts VRChat’s firewall blocks. When VRChat answers “slow down”, it stops.
          - generic [ref=e1030]:
            - term [ref=e1031]: VRChat’s API
            - definition [ref=e1032]: VRChat offers no support for third-party use of its API. Modbot is an independent, community-made tool. It is not affiliated with, endorsed by or supported by VRChat Inc.
          - generic [ref=e1033]:
            - term [ref=e1034]: The Discord bot’s permissions
            - definition [ref=e1035]: View Channels, Send Messages, Embed Links, Read Message History and View Audit Log. It does not ask for Administrator.
