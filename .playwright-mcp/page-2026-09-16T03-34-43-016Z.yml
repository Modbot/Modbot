    - region [ref=e984]:
      - generic [ref=e985]:
        - generic [ref=e986]:
          - heading "Runs on your own server." [level=2] [ref=e987]
          - paragraph [ref=e988]: Modbot is one container and one PostgreSQL database, and your group’s records are stored there.
          - list [ref=e989]:
            - listitem [ref=e990]: Every record Modbot keeps is in your database. Evidence files go to an S3-compatible bucket, a mounted folder or that same database.
            - listitem [ref=e991]: The server talks to VRChat. It also talks to Discord, to your mail server and to an AI provider when you set each one up. It never contacts modbot.co.
            - listitem [ref=e992]: Usage reports have no field for your group or its members, and you can turn them off.
            - listitem [ref=e993]: The desktop client also sends the events it reads from VRChat’s log, for every instance it is in, to Modbot Cloud as a backup. This is on by default, and the client has a switch for it.
            - listitem [ref=e994]: PostgreSQL is the only other service it needs.
