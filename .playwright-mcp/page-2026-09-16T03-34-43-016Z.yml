          - heading "Who is in the room, from a moderator’s own PC." [level=2] [ref=e621]
          - paragraph [ref=e622]: The Windows client reads VRChat’s own log as you play and reports who comes and goes. In SteamVR, an overlay lists the room and warns you when someone with a record walks in.
          - list [ref=e623]:
            - listitem [ref=e624]: Windows 10 and 11, installed without administrator rights. Quest and phone players are covered by the web app and the Discord bot.
            - listitem [ref=e625]: Pairs with your server through my.modbot.co, using a one-time link that lasts five minutes.
            - listitem [ref=e626]: Its token can only report presence and read the room list, and is stored encrypted to your Windows account.
            - listitem [ref=e627]: Pair it with more than one group.
