          - heading "Your Discord knows when the doors open." [level=2] [ref=f6e425]
          - paragraph [ref=f6e426]: The bot posts a card for each group instance, keeps it current as people come and go, and adds a Join button that opens VRChat.
          - list [ref=f6e427]:
            - listitem [ref=f6e428]: A moderation log channel for bans, unbans, kicks, warnings, turned-away join requests and role changes. You pick which.
