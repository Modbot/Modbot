        - generic [ref=f6e579]:
          - generic [ref=f6e580]: Client
          - heading "A moderator's eyes, inside the instance." [level=2] [ref=f6e583]
          - paragraph [ref=f6e584]: The Windows client reads VRChat's own log as you play and reports who comes and goes. In SteamVR, an overlay shows who is in the room and warns you when someone with a record walks in.
          - list [ref=f6e585]:
            - listitem [ref=f6e586]: Windows 10 and 11, installed without administrator rights.
            - listitem [ref=f6e587]: Pairs with your server through my.modbot.co, using a one-time link that lasts five minutes.
            - listitem [ref=f6e588]: Its token can only report presence and read the room list, and is stored encrypted to your Windows account.
            - listitem [ref=f6e589]: Pair it with more than one group.
