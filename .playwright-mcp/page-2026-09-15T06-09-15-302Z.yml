          - heading "Your server. Your data." [level=2] [ref=f6e905]
          - paragraph [ref=f6e906]: Modbot is one container and one PostgreSQL database. Your group’s records live there, and nowhere else.
          - list [ref=f6e907]:
            - listitem [ref=f6e908]: No Redis, no search server, no hosted sign-in, no third-party account.
            - listitem [ref=f6e909]: Works with no contact to modbot.co at all. my.modbot.co is a shortcut, never a requirement.
            - listitem [ref=f6e910]: Usage reports have no field for your group or its members, and you can turn them off.
            - listitem [ref=f6e911]: "Open source under AGPL-3.0: run it, read it, change it."
