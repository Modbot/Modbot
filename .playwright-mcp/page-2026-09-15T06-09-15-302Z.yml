              - code [ref=f6e430]: /lookup
              - text: a person or see
              - code [ref=f6e431]: /recent
              - text: actions, with replies only you can see.
            - listitem [ref=f6e432]: Names appear on a card only while a moderator is watching, and you can turn them off.
            - listitem [ref=f6e433]: Commands follow the same permissions as the web app.
