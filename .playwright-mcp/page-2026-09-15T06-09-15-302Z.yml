          - heading "Every ban gets a case file." [level=2] [ref=f6e516]
          - paragraph [ref=f6e517]: Pick the reasons, write it up, attach screenshots and clips. Modbot keeps a copy of the person's profile as it was at that moment.
          - list [ref=f6e518]:
            - listitem [ref=f6e519]: PNG, JPEG, WebP, GIF, MP4 and WebM, checked by what is inside the file, not its name.
            - listitem [ref=f6e520]: Stored in an S3-compatible bucket, a mounted folder or PostgreSQL. Every file is fingerprinted.
            - listitem [ref=f6e521]: Full edit history. A case file can be withdrawn with a note, never deleted.
            - listitem [ref=f6e522]: The Bans page counts recent bans that still have no case file.
