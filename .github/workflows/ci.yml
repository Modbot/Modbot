name: CI

# Only master, and only when asked. Day-to-day work lands on staging, which runs no CI; staging is
# merged into master once a batch is ready, and that merge is the run that has to be green.
on:
  push:
    branches: [master]
    # A run costs Actions minutes, and nothing below builds, lints or tests any of these. The
    # documentation site's own pages are .mdx and are deliberately not listed, so a change to them
    # still gets its build and its link check.
    paths-ignore:
      - '**/*.md'
      - '.agent/**'
      - '.github/FUNDING.yml'
      - '.playwright-mcp/**'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '**/*.png'
  workflow_dispatch:

jobs:
  # The .NET build and every test suite, split over parallel jobs. The Api suite alone took 71 of
  # the roughly 90 minutes of the run of 2026-10-06 (2195 tests, four classes at a time on a
  # four-processor runner, so every test was slowed by the others), and nothing else in the run
  # could start before it ended. The matrix below runs it as four shards, each on a runner of its
  # own, beside one job for every other suite:
  #
  #   other        every suite except Api, in the order the old single job ran them. This is the
  #                job that builds the whole solution and checks the OpenAPI document, so it is
  #                also the compile check of everything.
  #   api-1..api-3 the Api test classes listed for that shard in .github/test-shards/api.json.
  #   api-4        every Api test class not listed for api-1 to api-3, so a new test class that
  #                nobody has put in the file still runs, in this shard.
  #
  # The shards build only the Api test project and what it references. Each shard starts its own
  # PostgreSQL container (the Api test classes already have one database each and share nothing, so
  # a shard needs nothing from another).
  #
  # A job named `build` (below) gathers the result, because the repository's required check may
  # name `build`: it was this job's name before the split.
  tests:
    runs-on: ubuntu-latest
    # A hung suite is stopped by its own time limit below and still reported; this is the last
    # resort. The whole job, build and reporting included.
    timeout-minutes: 90
    strategy:
      # One failing shard must not hide the others: each one's result is worth having.
      fail-fast: false
      matrix:
        name: [other, api-1, api-2, api-3, api-4]
    env:
      SHARD: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        if: matrix.name == 'other'
        run: dotnet restore

      - name: Build
        if: matrix.name == 'other'
        run: dotnet build --no-restore --configuration Release

      # An Api shard needs only the Api test project and the projects it references.
      - name: Restore the Api tests
        if: matrix.name != 'other'
        run: dotnet restore tests/Modbot.Api.Tests

      - name: Build the Api tests
        if: matrix.name != 'other'
        run: dotnet build tests/Modbot.Api.Tests --no-restore --configuration Release

      # Building Modbot.Server rewrites docs/openapi/modbot.json from the endpoints themselves. The
      # docs site is built from the committed copy, so a change here means an endpoint changed and
      # the document was not rebuilt and committed with it.
      - name: Check the OpenAPI document is current
        if: matrix.name == 'other'
        run: |
          if ! git diff --exit-code -- docs/openapi/modbot.json; then
            echo "::error file=docs/openapi/modbot.json::The OpenAPI document is out of date. Build Modbot.Server and commit docs/openapi/modbot.json."
            exit 1
          fi

      # `dotnet test` does not drive Microsoft.Testing.Platform v2 on SDK 10.0.400 -- it
      # reports zero tests and exits 5. Run each suite directly instead. Docker is present
      # on ubuntu-latest, which Testcontainers needs for the real PostgreSQL the data tests
      # run against.
      # Every suite runs even after one fails, and the job fails at the end. `set -e` stopped at
      # the first failure, so a single broken suite hid every suite after it -- and the ones it
      # hid were the two that had never been proven to run on Linux at all.
      #
      # Each suite also has a time limit. xUnit prints nothing for a passing test, so a suite that
      # is slow and a suite that is stuck look the same in the log (the run of 2026-10-06 was
      # cancelled by hand after 1 h 40 m inside Modbot.Api.Tests with no way to tell which it was).
      # A suite that goes over the limit is now stopped, reported as timed out, and the rest still
      # run. The whole Test step took 2 to 4 hours on the runs of 2026-10-03 to 2026-10-05; the Api
      # suite is now cut into four shards that each take a fraction of that, so the limit is
      # lowered from 180 to 60 minutes (the job as a whole may not run past the 90 above). Raise it
      # if a shard or a suite honestly needs more. Interrupt first so the suite can clean up
      # (Docker containers), then kill 60 seconds later.
      #
      # `-longRunning` makes the suite print a line for any single test still running after that
      # many seconds, so a hang shows in the log long before the time limit ends it. It turns on
      # the suite's diagnostic messages, which is what prints those lines.
      #
      # Each suite's result, minutes and test count go into the run's summary page as a table
      # (one per job).
      #
      # The `other` job runs the suites in a fixed order, quick ones first and the two slowest
      # (VRChat, Discord) last. They ran in alphabetical order, so a broken test in a small suite
      # was reported only after the Api suite had finished; now it is reported within about
      # fifteen minutes. A suite that is in neither list below still runs, ahead of the slow two,
      # so a new project is never skipped; and a name in a list that no longer matches a project is
      # a warning, not silently ignored. The Api suite is not in this job: the api shards run it.
      #
      # An Api shard runs the Api suite once, with a response file that holds all of its arguments
      # (xUnit reads `@@ file`, one argument per line, so the long list of class names never has
      # to fit on a command line). The file is made by .github/scripts/shard-args.py from
      # .github/test-shards/api.json. A shard whose filter matched nothing would otherwise pass
      # in a few seconds, so a shard that ran fewer than MIN_SHARD_TESTS tests fails.
      - name: Test
        env:
          SUITE_TIME_LIMIT_MINUTES: 60
          LONG_RUNNING_TEST_SECONDS: 120
          MIN_SHARD_TESTS: 50
        run: |
          failed=""
          {
            echo "### Test suites ($SHARD)"
            echo
            echo "| Suite | Result | Minutes | Tests |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          api_suite="Modbot.Api.Tests"
          results="$GITHUB_WORKSPACE/test-results"
          mkdir -p "$results"
          suites=""
          is_suite() {
            # A project under tests/ that holds tests. Modbot.TestSupport is shared code only.
            if [ "$1" != "Modbot.TestSupport" ] && [ -f "tests/$1/$1.csproj" ]; then
              return 0
            fi
            return 1
          }
          add_suite() {
            case " $suites " in
              *" $1 "*) ;;
              *) suites="$suites $1" ;;
            esac
          }
          if [ "$SHARD" = "other" ]; then
            # Quick suites in the order they run, then any other suite found, then the slow two.
            quick_first="Modbot.Companion.App.Tests Modbot.Server.Tests Modbot.Landing.Tests Modbot.My.Tests Modbot.Overlay.Tests Modbot.Companion.Tests Modbot.Core.Tests Modbot.Evidence.Tests Modbot.Moderation.Tests Modbot.Cloud.Tests Modbot.AI.Tests Modbot.Analytics.Tests Modbot.Demo.Tests"
            slow_last="Modbot.VRChat.Tests Modbot.Discord.Tests"
            for name in $quick_first; do
              if is_suite "$name"; then
                add_suite "$name"
              else
                echo "::warning::$name is in the quick list of the Test step but is not a test project; update ci.yml."
              fi
            done
            for dir in tests/*/; do
              name="$(basename "$dir")"
              case " $slow_last $api_suite " in
                *" $name "*) continue ;;
              esac
              if is_suite "$name"; then
                add_suite "$name"
              fi
            done
            for name in $slow_last; do
              if is_suite "$name"; then
                add_suite "$name"
              else
                echo "::warning::$name is in the slow list of the Test step but is not a test project; update ci.yml."
              fi
            done
          else
            if is_suite "$api_suite"; then
              add_suite "$api_suite"
            else
              echo "::error::$api_suite is not a test project; update ci.yml."
              failed="$failed $api_suite"
            fi
          fi
          echo "Suites, in the order they run:$suites"
          for name in $suites; do
            proj="tests/$name/"
            echo "::group::$name"
            start=$SECONDS
            code=0
            note=""
            if [ "$SHARD" != "other" ]; then
              # All of the suite's arguments, one per line, in a response file.
              args_file="$RUNNER_TEMP/$SHARD.rsp"
              python3 .github/scripts/shard-args.py "$SHARD" "$args_file" "$results/$name.xml" "$LONG_RUNNING_TEST_SECONDS" || code=$?
              if [ "$code" -eq 0 ]; then
                echo "Arguments for this shard ($args_file):"
                cat "$args_file"
                timeout --signal=INT --kill-after=60s "${SUITE_TIME_LIMIT_MINUTES}m" \
                  dotnet run --project "$proj" --configuration Release --no-build \
                  -- @@ "$args_file" || code=$?
              else
                note=" (the shard's arguments could not be made)"
              fi
            else
              timeout --signal=INT --kill-after=60s "${SUITE_TIME_LIMIT_MINUTES}m" \
                dotnet run --project "$proj" --configuration Release --no-build \
                -- -longRunning "$LONG_RUNNING_TEST_SECONDS" -result-xml "$results/$name.xml" || code=$?
            fi
            minutes="$(awk -v s=$((SECONDS - start)) 'BEGIN { printf "%.1f", s / 60 }')"
            echo "::endgroup::"
            # How many tests ran, from the suite's own result file (0 when there is none).
            tests_run="$(python3 .github/scripts/count-tests.py "$results/$name.xml" || true)"
            case "$tests_run" in
              ''|*[!0-9]*) tests_run=0 ;;
            esac
            # timeout exits 124 when it had to interrupt the suite and 137 when it had to kill it.
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "::error::$name timed out after ${SUITE_TIME_LIMIT_MINUTES}m"
              result="TIMED OUT after ${SUITE_TIME_LIMIT_MINUTES}m"
              failed="$failed $name"
            elif [ "$code" -ne 0 ]; then
              result="failed (exit $code)$note"
              failed="$failed $name"
            elif [ "$SHARD" != "other" ] && [ "$tests_run" -lt "$MIN_SHARD_TESTS" ]; then
              echo "::error::$name [$SHARD] ran only $tests_run tests (at least $MIN_SHARD_TESTS expected): its filter matched too little. Check .github/test-shards/api.json."
              result="FAILED: only $tests_run tests ran"
              failed="$failed $name"
            else
              result="passed"
            fi
            label="$name"
            if [ "$SHARD" != "other" ]; then
              label="$name [$SHARD]"
            fi
            echo "| $label | $result | $minutes | $tests_run |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing suites:$failed"
            exit 1
          fi

      # Each suite also writes a per-test timing file (xUnit's own -result-xml, one <test> element
      # with a `time` in seconds per test), because the minutes per suite above cannot say which
      # tests are slow: the Api suite alone took 112 minutes on the run of 2026-10-06 and xUnit
      # prints nothing for a passing test. The next two steps put the slowest tests and classes
      # on the summary page and keep the files as a build artifact for a few days. They are
      # reporting only: they run after a failure too, a missing or cut-off file is skipped, and
      # neither can fail the job (the Test step's own result decides that). A suite stopped for
      # running over its time limit writes no file, since xUnit writes it at the end. Each job
      # keeps its own files under its own artifact name (two artifacts may not share one).
      - name: Slowest tests
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/slowest-tests.py test-results >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the test timing files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.name }}
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 5

  # The one result for the .NET side of the run: it passes only when every job above passed.
  # `if: always()` is what makes it run (and fail) when a test job failed, rather than being
  # skipped, and a skipped job would let a required check pass. `needs.tests.result` is `success`
  # only when every entry of the matrix succeeded.
  build:
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every build and test job passed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests (every matrix job): $TESTS_RESULT"
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::The build and test jobs did not all succeed (result: $TESTS_RESULT). See the tests jobs above."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Modbot.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Modbot.Web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # my.modbot.co's web app. `npm run build` type-checks before bundling; `npm test` runs the
  # /go path-safety and server-list tests on Node's own test runner.
  my-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Modbot.My.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Modbot.My.Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # cloud.modbot.co's admin app. `npm run build` type-checks before bundling into
  # src/Modbot.Cloud/wwwroot.
  cloud-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Modbot.Cloud/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Modbot.Cloud/Web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - run: npm run lint

  # docs.modbot.co, the documentation site. `npm run build` exports every page, the API reference
  # (from the committed docs/openapi/modbot.json) and the search index into docs/out; the link
  # check then reads that output, so a link to a page or heading that does not exist fails here.
  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run check-links

  # modbot.co's landing page. `npm run build` type-checks, bundles and prerenders the page into
  # src/Modbot.Landing/wwwroot; `npm test` runs the sample-evening and popup-stack tests.
  landing-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Modbot.Landing/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Modbot.Landing/Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
