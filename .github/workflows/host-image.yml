# Builds the server image -- the SPA, the API, the Discord bot and the sync scheduler in one
# container, from the Dockerfile at the root -- and pushes it to GitHub's container registry as
# ghcr.io/<owner>/modbot-host.
#
# Two kinds of build, told apart by what was pushed:
#
#   a commit on master        ghcr.io/<owner>/modbot-host:edge
#                             ghcr.io/<owner>/modbot-host:sha-<short commit>
#   a tag host-vYYYY.M.PATCH  ghcr.io/<owner>/modbot-host:YYYY.M.PATCH
#                             ghcr.io/<owner>/modbot-host:latest
#
# `latest` is a named release and nothing else, so an operator who pulls it gets a version somebody
# chose to name. `edge` follows master. The version after `host-v` is stamped into the build
# (ModbotVersion.Release, the assembly version, the Deployment card), the same way companion-v tags
# name the companion, so the tag is the one place a server release is named.
#
# The package takes the repository's visibility. While the repository is private, pulling needs
# `docker login ghcr.io` with a token that can read packages; docs/content/docs/self-hosting/docker.mdx
# says how.

name: Host image

on:
  push:
    branches: [master]
    tags:
      - 'host-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/modbot-host

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#host-v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+$ ]]; then
            echo "::error::The tag must look like host-v2026.9.1 (year.month.patch, no leading zeros); got '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing server $version"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags above, and the OCI labels every registry shows: source, revision, created.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # The commit and branch go in under the names the Dockerfile already declares for Railway;
      # they work the same here. MODBOT_RELEASE is only set on a tag, so an edge build carries the
      # development version and says so on the Deployment card.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
            RAILWAY_GIT_BRANCH=${{ github.ref_type == 'branch' && github.ref_name || 'master' }}
            MODBOT_RELEASE=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
