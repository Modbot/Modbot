# Builds the companion for Windows and for Linux and publishes both as one GitHub Release, which
# is where installed copies download an update from. What they *ask* is Modbot Cloud, which reads
# this release and serves the same index (see UPDATE_FEED below).
#
# Two ways to run it:
#
#   A release  Push a tag named companion-vYYYY.M.PATCH, for example `companion-v2026.9.1`.
#   A preview  Run it from the Actions tab (Run workflow) and type the version as
#              YYYY.M.PATCH-preview.N, for example `2026.9.2-preview.1`. It builds whichever
#              branch it was run on and makes the tag itself.
#
# Running it by hand publishes a preview and nothing else. A general release comes from a tag, so
# there is always a commit named as the one that went out.
#
# The version -- from the tag, or typed in -- is stamped into the build: ModbotVersion.Release, the
# exe's file version, the installer and the update feed all carry the same string. It is the one
# place a release is named.
#
# A preview goes out on its own channel, win-preview and linux-preview, and is marked a pre-release
# on GitHub. Velopack writes the channel into the copy it installs and an installed copy asks for
# its own channel for the rest of its life, so a preview is only ever offered preview versions and
# a release is only ever offered releases. Neither can be handed the other by accident.
#
# What comes out, attached to the release (what a preview is called, in brackets):
#   Modbot-win-Setup.exe        the Windows installer testers download
#                               [Modbot-win-preview-Setup.exe]
#   Modbot-win-Portable.zip     the same files with no installer, for a machine that cannot install
#                               [Modbot-win-preview-Portable.zip]
#   Modbot.AppImage             the Linux build: one file, made runnable and run
#                               [Modbot-linux-preview.AppImage]
#   Modbot-<version>-full.nupkg, *-delta.nupkg, releases.win.json, RELEASES
#   Modbot-<version>-linux-full.nupkg, releases.linux.json, RELEASES-linux
#                               what installed copies read and download when they update
#                               [the same files with -preview in the channel: releases.win-preview.json]
#
# The two builds are separate jobs and Windows goes first: vpk creates the release on the tag and
# the Linux job merges its files into it, and two jobs creating the same release at once would
# race. Each job runs the companion and overlay suites on its own platform, so the Linux-only
# paths (VRChat's log under Proton, the key-file token store, the raw-pixel overlay) are tested
# where they run.
#
# Signing is optional and skipped cleanly when the secrets are absent. Unsigned builds trip
# SmartScreen; docs/content/docs/companion/install.mdx and .../preview.mdx tell testers how to get
# past it and the M3 spec (8.2) says what a real certificate involves. There is no signing on Linux.
#
# The steps for publishing a preview, in order, are in src/Modbot.Companion.App/README.md.

name: Client release

on:
  push:
    tags:
      - 'companion-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version, such as 2026.9.2-preview.1'
        required: true
        type: string

permissions:
  contents: write

env:
  # Where the release and its files go. Defaults to this repository. While this repository is
  # private, installed copies cannot download its releases without a token, so set the repository
  # variable CLIENT_RELEASES_REPO to a public `owner/repo` (and the secret CLIENT_RELEASES_TOKEN to
  # a token that can write its releases) to publish there instead.
  RELEASES_REPO: ${{ vars.CLIENT_RELEASES_REPO || github.repository }}
  RELEASES_TOKEN: ${{ secrets.CLIENT_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
  # Where installed copies ask what the newest version is. Modbot Cloud, which reads the releases
  # published above and serves the same index out of one cached copy -- so however many clients
  # exist, GitHub is asked a few times a day rather than by each of them. The packages are still
  # downloaded from GitHub. Set the repository variable CLIENT_UPDATE_FEED to point a fork's
  # clients somewhere else (a GitHub repository address works too).
  UPDATE_FEED: ${{ vars.CLIENT_UPDATE_FEED || 'https://cloud.modbot.co/api/v1/updates/companion' }}

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Both jobs work this out the same way; the only difference is which channel the platform
      # starts from. Keep the two copies in step.
      - name: Work out the version and the channel
        shell: bash
        env:
          CHANNEL_BASE: win
          TYPED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${TYPED_VERSION#companion-v}"
          else
            version="${GITHUB_REF_NAME#companion-v}"
          fi

          if ! [[ "$version" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like 2026.9.1 (year.month.patch, no leading zeros), or 2026.9.1-preview.1 for a preview; got '$version'."
            exit 1
          fi

          if [[ "$version" == *-preview.* ]]; then preview=true; else preview=false; fi

          # A general release is always a tag, so the commit it came from is named for good. Running
          # this by hand is for previews and nothing else.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$preview" != true ]; then
            echo "::error::Running this by hand only publishes a preview, and '$version' is not one. Push a companion-v$version tag to release."
            exit 1
          fi

          if [ "$preview" = true ]; then
            channel="$CHANNEL_BASE-preview"
            name="Modbot Companion $version (preview)"
          else
            channel="$CHANNEL_BASE"
            name="Modbot Companion $version"
          fi

          {
            echo "VERSION=$version"
            echo "TAG=companion-v$version"
            echo "PREVIEW=$preview"
            echo "CHANNEL=$channel"
            echo "RELEASE_NAME=$name"
          } >> "$GITHUB_ENV"

          echo "Publishing companion $version on the $channel channel"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release "-p:ModbotRelease=${{ env.VERSION }}"

      # Run directly, not through `dotnet test`, for the reason in CLAUDE.md: the suites are xUnit
      # v3 on Microsoft.Testing.Platform, which SDK 10.0.400's `dotnet test` does not drive.
      - name: Test the companion
        run: dotnet run --project tests/Modbot.Companion.Tests --configuration Release --no-build "-p:ModbotRelease=${{ env.VERSION }}"

      - name: Test the overlay
        run: dotnet run --project tests/Modbot.Overlay.Tests --configuration Release --no-build "-p:ModbotRelease=${{ env.VERSION }}"

      - name: Publish
        run: >
          dotnet publish src/Modbot.Companion.App --configuration Release
          -p:PublishProfile=win-x64
          "-p:ModbotRelease=${{ env.VERSION }}"
          "-p:ModbotUpdateFeed=${{ env.UPDATE_FEED }}"

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk --version 1.2.0

      # Earlier releases are needed beside the new one for vpk to build delta packages. Absent
      # on the very first release, which is fine: that one is full-only. A preview looks among
      # the pre-releases, which is where the earlier previews are.
      - name: Fetch earlier releases so this one can ship deltas
        continue-on-error: true
        run: >
          vpk download github
          --channel "${{ env.CHANNEL }}"
          ${{ env.PREVIEW == 'true' && '--pre' || '' }}
          --repoUrl "https://github.com/${{ env.RELEASES_REPO }}"
          --token "${{ env.RELEASES_TOKEN }}"
          --outputDir artifacts/client/releases

      # Code signing, when the project has a certificate. SIGN_CERT_BASE64 is a PFX encoded as
      # base64; SIGN_CERT_PASSWORD is its password. When either is absent the step is skipped
      # and vpk packs unsigned, saying so in its log. The parameters go to vpk through its
      # environment variable rather than the command line, so the password is not echoed.
      - name: Prepare code signing
        if: env.SIGN_CERT_BASE64 != '' && env.SIGN_CERT_PASSWORD != ''
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'modbot-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          "VPK_SIGN_PARAMS=/f `"$pfx`" /p `"$env:SIGN_CERT_PASSWORD`" /tr http://timestamp.digicert.com /td sha256 /fd sha256" >> $env:GITHUB_ENV
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          Write-Host "Signing is on."

      - name: Say so when the build is unsigned
        if: env.VPK_SIGN_PARAMS == ''
        run: echo "::warning::No signing certificate configured (SIGN_CERT_BASE64 / SIGN_CERT_PASSWORD). This release is unsigned and will trip SmartScreen on download."

      # The channel is written into the package, and an installed copy asks for that channel for
      # the rest of its life. It is what keeps a preview and a release apart on one machine.
      - name: Pack the installer, the portable zip and the update files
        run: >
          vpk pack
          --packId Modbot
          --packVersion "${{ env.VERSION }}"
          --channel "${{ env.CHANNEL }}"
          --packDir artifacts/client/publish
          --mainExe Modbot.exe
          --packTitle Modbot
          --packAuthors Modbot
          --icon src/Modbot.Companion.App/Assets/Modbot.ico
          --shortcuts StartMenuRoot
          --outputDir artifacts/client/releases

      - name: Remove the signing certificate from the runner
        if: always() && env.SIGNING_PFX != ''
        shell: pwsh
        run: Remove-Item -Force $env:SIGNING_PFX -ErrorAction SilentlyContinue

      # A preview is published as a GitHub pre-release, so the releases page keeps its "Latest"
      # badge on the newest real release and nobody arriving there downloads a preview by mistake.
      # The commit is named because a run started by hand has no tag yet and makes one.
      - name: Publish the GitHub release
        run: >
          vpk upload github
          --channel "${{ env.CHANNEL }}"
          ${{ env.PREVIEW == 'true' && '--pre' || '' }}
          --repoUrl "https://github.com/${{ env.RELEASES_REPO }}"
          --token "${{ env.RELEASES_TOKEN }}"
          --outputDir artifacts/client/releases
          --tag "${{ env.TAG }}"
          --targetCommitish "${{ github.sha }}"
          --releaseName "${{ env.RELEASE_NAME }}"
          --publish
          --merge

      # The same files, kept with the run, for anybody who wants them without going through
      # the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: modbot-companion-${{ env.VERSION }}-windows
          path: artifacts/client/releases

  linux:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The same reckoning as the Windows job, starting from the Linux channel.
      - name: Work out the version and the channel
        env:
          CHANNEL_BASE: linux
          TYPED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${TYPED_VERSION#companion-v}"
          else
            version="${GITHUB_REF_NAME#companion-v}"
          fi

          if ! [[ "$version" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like 2026.9.1 (year.month.patch, no leading zeros), or 2026.9.1-preview.1 for a preview; got '$version'."
            exit 1
          fi

          if [[ "$version" == *-preview.* ]]; then preview=true; else preview=false; fi

          if [ "$preview" = true ]; then
            channel="$CHANNEL_BASE-preview"
            name="Modbot Companion $version (preview)"
          else
            channel="$CHANNEL_BASE"
            name="Modbot Companion $version"
          fi

          {
            echo "VERSION=$version"
            echo "TAG=companion-v$version"
            echo "PREVIEW=$preview"
            echo "CHANNEL=$channel"
            echo "RELEASE_NAME=$name"
          } >> "$GITHUB_ENV"

          echo "Publishing companion $version on the $channel channel"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release "-p:ModbotRelease=${{ env.VERSION }}"

      - name: Test the companion
        run: dotnet run --project tests/Modbot.Companion.Tests --configuration Release --no-build "-p:ModbotRelease=${{ env.VERSION }}"

      - name: Test the overlay
        run: dotnet run --project tests/Modbot.Overlay.Tests --configuration Release --no-build "-p:ModbotRelease=${{ env.VERSION }}"

      - name: Publish
        run: >
          dotnet publish src/Modbot.Companion.App --configuration Release
          -p:PublishProfile=linux-x64
          "-p:ModbotRelease=${{ env.VERSION }}"
          "-p:ModbotUpdateFeed=${{ env.UPDATE_FEED }}"

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk --version 1.2.0

      # The Linux files live on their own channel of the same release, so vpk is told which
      # channel at every step; its default is the Windows one.
      - name: Fetch earlier releases so this one can ship deltas
        continue-on-error: true
        run: >
          vpk download github
          --channel "${{ env.CHANNEL }}"
          ${{ env.PREVIEW == 'true' && '--pre' || '' }}
          --repoUrl "https://github.com/${{ env.RELEASES_REPO }}"
          --token "${{ env.RELEASES_TOKEN }}"
          --outputDir artifacts/client/releases-linux

      - name: Pack the AppImage and the update files
        run: >
          vpk pack
          --packId Modbot
          --packVersion "${{ env.VERSION }}"
          --channel "${{ env.CHANNEL }}"
          --packDir artifacts/client/publish-linux
          --mainExe Modbot
          --packTitle Modbot
          --packAuthors Modbot
          --icon src/Modbot.Companion.App/Assets/icon-256.png
          --outputDir artifacts/client/releases-linux

      - name: Add the Linux files to the GitHub release
        run: >
          vpk upload github
          --channel "${{ env.CHANNEL }}"
          ${{ env.PREVIEW == 'true' && '--pre' || '' }}
          --repoUrl "https://github.com/${{ env.RELEASES_REPO }}"
          --token "${{ env.RELEASES_TOKEN }}"
          --outputDir artifacts/client/releases-linux
          --tag "${{ env.TAG }}"
          --targetCommitish "${{ github.sha }}"
          --releaseName "${{ env.RELEASE_NAME }}"
          --publish
          --merge

      - uses: actions/upload-artifact@v4
        with:
          name: modbot-companion-${{ env.VERSION }}-linux
          path: artifacts/client/releases-linux
